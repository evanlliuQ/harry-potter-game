<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>哈利波特：神秘的魔法石 — 四大學院專屬冒險與禁區試煉</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入古典襯線字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --night-deep: #070b14;
            --night-mid: #11192c;
            --gold-bright: #f5d061;
            --gold-dim: #b8860b;
            --parchment-light: #f4e8d1;
            --parchment-dark: #dcc69e;
            --ink-brown: #2c1e16;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Serif TC', serif;
            background: radial-gradient(ellipse at bottom, var(--night-mid) 0%, var(--night-deep) 100%);
            color: var(--parchment-light);
            overflow-x: hidden;
            min-height: 100vh;
            user-select: none;
        }

        .font-magic-en {
            font-family: 'Cinzel', serif;
        }

        /* 古典羊皮紙捲軸樣式 */
        .parchment-scroll {
            background: 
                radial-gradient(circle at top left, rgba(255,255,255,0.45), transparent 60%),
                radial-gradient(circle at bottom right, rgba(139, 90, 43, 0.25), transparent 60%),
                linear-gradient(135deg, var(--parchment-light) 0%, var(--parchment-dark) 100%);
            color: var(--ink-brown);
            border: 2px solid #9c7248;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.85),
                inset 0 0 35px rgba(139, 90, 43, 0.45);
            position: relative;
        }

        .scroll-roller {
            height: 14px;
            background: linear-gradient(90deg, #3e2723 0%, #8d6e63 20%, #d7ccc8 50%, #8d6e63 80%, #3e2723 100%);
            border-radius: 9999px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            border: 1px solid #261612;
        }

        .emerald-ink {
            color: #135e3d;
            text-shadow: 0 0 1px rgba(19, 94, 61, 0.25);
        }

        /* 魔法按鈕與互動元件 */
        .magic-btn {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--gold-bright);
            color: var(--gold-bright);
            box-shadow: 0 0 15px rgba(245, 208, 97, 0.2);
            transition: all 0.2s ease;
        }
        .magic-btn:hover:not(:disabled) {
            background: linear-gradient(180deg, #2d3b55 0%, #17233b 100%);
            box-shadow: 0 0 22px rgba(245, 208, 97, 0.6);
            transform: translateY(-2px);
        }
        .magic-btn:active:not(:disabled) {
            transform: translateY(1px);
        }
        .magic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 角色剪影卡片選中效果 */
        .char-card {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(156, 114, 72, 0.4);
            background: rgba(255, 250, 240, 0.6);
        }
        .char-card:hover {
            transform: translateY(-4px);
            border-color: #8b4513;
            background: rgba(255, 250, 240, 0.9);
        }
        .char-card.selected {
            border-color: #991b1b;
            background: rgba(254, 242, 242, 0.95);
            box-shadow: 0 8px 20px rgba(153, 27, 27, 0.25);
            transform: translateY(-4px) scale(1.02);
        }

        /* 動畫特效 */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-scene-enter {
            animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes wandSwirl {
            0% { transform: rotate(0deg) scale(0.95); opacity: 0.7; }
            50% { transform: rotate(180deg) scale(1.08); opacity: 1; }
            100% { transform: rotate(360deg) scale(0.95); opacity: 0.7; }
        }
        .animate-swirl {
            animation: wandSwirl 3.2s linear infinite;
        }

        @keyframes hatTalk {
            0%, 100% { transform: rotate(-4deg) scaleY(1); }
            25% { transform: rotate(5deg) scaleY(0.92); }
            50% { transform: rotate(-3deg) scaleY(1.06); }
            75% { transform: rotate(4deg) scaleY(0.95); }
        }
        .animate-hat-talk {
            animation: hatTalk 0.65s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes hatMouth {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1.2); }
        }
        .animate-hat-mouth {
            animation: hatMouth 0.35s ease-in-out infinite;
            transform-origin: center;
        }

        .game-canvas-box {
            position: relative;
            width: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            border: 2px solid #785536;
            background: #0a0f1d;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
            touch-action: none;
        }
    </style>
</head>

        /**
         * ==========================================
         * 2. Web Audio API 即時魔法音效與《海德薇變奏曲》背景音樂引擎
         * ==========================================
         */
        const AudioEngine = {
            ctx: null,
            muted: false,
            bgmMuted: false,
            bgmTimer: null,
            bgmIndex: 0,
            isPlayingBgm: false,

            hedwigMelody: [
                { f: 493.88, d: 0.38 }, { f: 659.25, d: 0.57 }, { f: 783.99, d: 0.19 }, { f: 739.99, d: 0.38 },
                { f: 659.25, d: 0.76 }, { f: 987.77, d: 0.38 }, { f: 880.00, d: 1.14 }, { f: 739.99, d: 1.14 },
                { f: 659.25, d: 0.57 }, { f: 783.99, d: 0.19 }, { f: 739.99, d: 0.38 }, { f: 587.33, d: 0.76 },
                { f: 698.46, d: 0.38 }, { f: 493.88, d: 1.14 }, { f: 0,      d: 0.38 },
                { f: 493.88, d: 0.38 }, { f: 659.25, d: 0.57 }, { f: 783.99, d: 0.19 }, { f: 739.99, d: 0.38 },
                { f: 659.25, d: 0.76 }, { f: 987.77, d: 0.38 }, { f: 1174.66, d: 0.76 }, { f: 1108.73, d: 0.38 },
                { f: 1046.50, d: 0.76 }, { f: 830.61, d: 0.38 }, { f: 1046.50, d: 0.57 }, { f: 987.77, d: 0.19 },
                { f: 932.33, d: 0.38 }, { f: 466.16, d: 0.76 }, { f: 783.99, d: 0.38 }, { f: 659.25, d: 1.14 },
                { f: 0,      d: 0.65 }
            ],

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if (!this.isPlayingBgm && !this.bgmMuted) {
                    this.startBgm();
                }
            },

            playCelestaNote(freq, duration) {
                if (this.bgmMuted || freq <= 0 || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc1.type = 'sine';
                osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(freq, now);
                osc2.frequency.setValueAtTime(freq * 2, now);
                const subGain = this.ctx.createGain();
                subGain.gain.setValueAtTime(0.025, now);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.085, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration + 0.45);
                osc1.connect(gain);
                osc2.connect(subGain);
                subGain.connect(gain);
                gain.connect(this.ctx.destination);
                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + duration + 0.5);
                osc2.stop(now + duration + 0.5);
            },

            startBgm() {
                if (this.isPlayingBgm) return;
                this.isPlayingBgm = true;
                const playNext = () => {
                    if (!this.isPlayingBgm) return;
                    const note = this.hedwigMelody[this.bgmIndex];
                    if (!this.bgmMuted && note.f > 0) {
                        this.playCelestaNote(note.f, note.d);
                    }
                    this.bgmIndex = (this.bgmIndex + 1) % this.hedwigMelody.length;
                    this.bgmTimer = setTimeout(playNext, note.d * 1000);
                };
                playNext();
            },

            toggleBgm() {
                this.bgmMuted = !this.bgmMuted;
                const btn = document.getElementById('bgmToggleBtn');
                if (this.bgmMuted) {
                    btn.textContent = '🔇 背景音樂：關閉';
                } else {
                    btn.textContent = '🎵 背景音樂：開啟';
                    this.init();
                }
            },

            toggleMute() {
                this.muted = !this.muted;
                document.getElementById('muteToggleBtn').textContent = this.muted ? '🔇 魔法音效：靜音' : '🔊 魔法音效：開啟';
            },

            playTone(freq, type = 'sine', duration = 0.3, vol = 0.12, delay = 0) {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(vol, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + duration + 0.05);
            },
            playSuccess() {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => this.playTone(f, 'sine', 0.4, 0.12, i * 0.07));
            },
            playError() {
                this.playTone(180, 'sawtooth', 0.25, 0.15, 0);
                this.playTone(140, 'sawtooth', 0.35, 0.15, 0.12);
            },

                    el.textContent += text.charAt(i);

        function startRavenclaw2() {
            document.getElementById('hudStageLabel').textContent = '雷文克勞第二關：進行中';
            const targetAngles = [
                Math.floor(Math.random() * 4) * 90,
                Math.floor(Math.random() * 4) * 90,
                Math.floor(Math.random() * 4) * 90
            ];
            let currentAngles = [
                (targetAngles[0] + 90) % 360,
                (targetAngles[1] + 180) % 360,
                (targetAngles[2] + 270) % 360
            ];

            function calcResonance() {
                let score = 0;
                for (let i = 0; i < 3; i++) {
                    const diff = Math.abs(currentAngles[i] - targetAngles[i]);
                    if (diff === 0) score += 34;
                    else if (diff === 90 || diff === 270) score += 16;
                }
                return Math.min(100, score);
            }

                                    <button onclick="rotatePrism(${idx})" class="magic-btn px-3 py-1 rounded-lg text-xs font-bold cursor-pointer">🔄 旋轉 90°</button>
                                </div>
                            `).join('')}
                        </div>

                        <div class="space-y-1.5">
                            <div class="text-xs font-bold text-amber-300">✨ 星光折射共鳴度：<span id="prismResPct">${calcResonance()}</span>%</div>
                            <div class="w-full h-4 bg-slate-800 rounded-full overflow-hidden border border-sky-400/40">
                                <div id="prismResBar" class="h-full bg-gradient-to-r from-blue-600 via-sky-400 to-amber-300 transition-all duration-300" style="width: ${calcResonance()}%"></div>
                            </div>
                        </div>
                    </div>
                </div>

            window.rotatePrism = function(idx) {
                currentAngles[idx] = (currentAngles[idx] + 90) % 360;
                AudioEngine.playTone(440 + currentAngles[idx], 'sine', 0.18, 0.12);
                document.getElementById(`prismIcon_${idx}`).style.transform = `rotate(${currentAngles[idx]}deg)`;
                document.getElementById(`prismDeg_${idx}`).textContent = `${currentAngles[idx]}°`;

                const pct = calcResonance();
                document.getElementById('prismResPct').textContent = pct;
                document.getElementById('prismResBar').style.width = `${pct}%`;

                            AudioEngine.playError();

        function startSlytherin2() {
            document.getElementById('hudStageLabel').textContent = '史萊哲林第二關：進行中';
            const pool = ['🐍', '👑', '🗡️', '🧪', '🕯️'];
            const secret = [...pool].sort(() => Math.random() - 0.5).slice(0, 4);
            let guess = [];

            stage.innerHTML = `
                <div class="animate-scene-enter space-y-3 text-center">
                    <div class="border-b border-amber-900/20 pb-2 text-left">

                        </div>

                        <div class="flex justify-center gap-2 flex-wrap">
                            ${pool.map(sym => `
                                <button onclick="pickSlyRune('${sym}')" class="px-3.5 py-2 rounded-xl bg-emerald-950 hover:bg-emerald-900 border border-amber-400/50 text-xl cursor-pointer">${sym}</button>

                            <button onclick="submitSlyCode()" class="magic-btn px-5 py-1.5 rounded-lg text-xs font-bold cursor-pointer">🔓 驗證密碼</button>
                        </div>

                        <div id="slyHistory" class="text-xs text-left max-h-24 overflow-y-auto bg-slate-900/90 p-2.5 rounded-lg border border-emerald-500/20 space-y-1 text-emerald-200">
                            <div class="text-amber-300/80">💡 提示：密碼由 4 個不重複符文組成，請開始嘗試！</div>
                        </div>
                    </div>
                </div>
            `;

            window.pickSlyRune = function(sym) {
                if (guess.length >= 4 || guess.includes(sym)) return;
                AudioEngine.playClick();
                guess.push(sym);
                document.getElementById(`slot_${guess.length - 1}`).textContent = sym;
            };

            window.clearSlySlots = function() {
                guess = [];
                for (let i = 0; i < 4; i++) document.getElementById(`slot_${i}`).textContent = '?';
            };

            window.submitSlyCode = function() {
                if (guess.length < 4) return;
                let exact = 0;
                let present = 0;
                guess.forEach((g, idx) => {
                    if (g === secret[idx]) exact++;
                    else if (secret.includes(g)) present++;
                });

                const hist = document.getElementById('slyHistory');
                if (exact === 4) {
                    AudioEngine.playSuccess();
                    GameState.inventory.push('翡翠蛇紋鑰匙');
                    addPoints(50);
                    playTransitionScene(
                        '史萊哲林第二關通關（+50分）',

                    clearSlySlots();

            const playerX = 65;
            let keysCaught = 0;
            let hp = 5; // 護盾從 3 提升為 5，降低難度
            let frame = 0;
            let gameOver = false;

            const obstacles = [];
            const keys = [];

            function updatePlayerY(clientY) {
                const r = fCanvas.getBoundingClientRect();
                playerY = Math.max(22, Math.min(fCanvas.height - 22, clientY - r.top));
            }

            fCanvas.addEventListener('mousemove', e => updatePlayerY(e.clientY));
            fCanvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (e.touches[0]) updatePlayerY(e.touches[0].clientY);
            }, { passive: false });

            function loop() {
                if (gameOver || !document.getElementById('flightCanvas')) return;
                frame++;
                fCtx.clearRect(0, 0, fCanvas.width, fCanvas.height);

                fCtx.fillStyle = '#090e1c';
                fCtx.fillRect(0, 0, fCanvas.width, fCanvas.height);
                fCtx.strokeStyle = 'rgba(245, 208, 97, 0.14)';
                fCtx.lineWidth = 1;
                for (let i = 0; i < 6; i++) {
                    const lx = (fCanvas.width - ((frame * 4 + i * 140) % (fCanvas.width + 100)));
                    fCtx.beginPath();
                    fCtx.moveTo(lx, 30 + i * 42);
                    fCtx.lineTo(lx + 70, 30 + i * 42);
                    fCtx.stroke();
                }

                // 降低遊走球生成頻率與速度
                if (frame % 42 === 0) {
                    obstacles.push({
                        x: fCanvas.width + 20,
                        y: Math.random() * (fCanvas.height - 44) + 22,
                        r: 13,
                        vx: 3.6 + Math.random() * 1.4,
                        vy: (Math.random() - 0.5) * 1.2
                    });
                }

                // 提高飛翅鑰匙生成頻率並減慢橫移速度，讓玩家更容易接住
                if (frame % 48 === 0) {
                    keys.push({
                        x: fCanvas.width + 20,
                        y: Math.random() * (fCanvas.height - 64) + 32,
                        vx: 2.9,
                        wobble: Math.random() * Math.PI * 2
                    });
                }

                // 繪製主角掃帚
                fCtx.save();
                fCtx.translate(playerX, playerY);
                fCtx.fillStyle = 'rgba(245, 208, 97, 0.4)';
                fCtx.beginPath();
                fCtx.moveTo(-18, 4);
                fCtx.lineTo(-46 - Math.sin(frame * 0.5) * 10, 0);
                fCtx.lineTo(-18, -4);
                fCtx.fill();
                fCtx.strokeStyle = '#d97706';
                fCtx.lineWidth = 3;
                fCtx.beginPath();
                fCtx.moveTo(-22, 4);
                fCtx.lineTo(24, -2);
                fCtx.stroke();
                const robeColors = { '葛來分多': '#dc2626', '雷文克勞': '#2563eb', '赫夫帕夫': '#d97706', '史萊哲林': '#059669' };
                fCtx.fillStyle = robeColors[GameState.house] || '#dc2626';
                fCtx.beginPath();
                fCtx.arc(0, -6, 8, 0, Math.PI * 2);
                fCtx.fill();
                fCtx.fillStyle = '#fde047';
                fCtx.beginPath();
                fCtx.arc(4, -13, 5, 0, Math.PI * 2);
                fCtx.fill();
                fCtx.restore();

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const o = obstacles[i];
                    o.x -= o.vx;
                    o.y += o.vy;
                    if (o.y < 16 || o.y > fCanvas.height - 16) o.vy = -o.vy;
                    
                    fCtx.beginPath();
                    fCtx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
                    fCtx.fillStyle = '#450a0a';
                    fCtx.fill();
                    fCtx.lineWidth = 2.5;
                    fCtx.strokeStyle = '#ef4444';
                    fCtx.stroke();

                    if (Math.hypot(o.x - playerX, o.y - playerY) < o.r + 11) {
                        AudioEngine.playError();
                        GameState.mistakes++;
                        obstacles.splice(i, 1);
                        hp--;
                        document.getElementById('l2Hp').textContent = hp;
                        if (hp <= 0) {
                            gameOver = true;
                            document.getElementById('l2Box').innerHTML = `
                                <div class="w-full h-full flex flex-col items-center justify-center bg-slate-950/90 text-center p-4 space-y-3">
                                    <div class="text-red-400 font-black text-lg">💥 掃帚被${camp.l2.hazardName}擊中墜落！</div>
                                    <p class="text-xs text-amber-200/80">請上下移動避開紅色球體，捕捉 4 把飛翅鑰匙！</p>
                                    <button onclick="startLevel2()" class="magic-btn px-5 py-2 rounded-xl font-bold text-sm cursor-pointer">🔄 重新起飛挑戰</button>
                                </div>
                            `;
                            return;
                        }
                        continue;
                    }
                    if (o.x < -30) obstacles.splice(i, 1);
                }

                for (let i = keys.length - 1; i >= 0; i--) {
                    const k = keys[i];
                    k.x -= k.vx;
                    k.y += Math.sin(frame * 0.1 + k.wobble) * 1.6;
                    k.y = Math.max(24, Math.min(fCanvas.height - 24, k.y));

                    fCtx.save();
                    fCtx.translate(k.x, k.y);
                    // 發光外圈提示，更容易看清與捕捉
                    fCtx.beginPath();
                    fCtx.arc(0, 0, 18, 0, Math.PI * 2);
                    fCtx.fillStyle = 'rgba(253, 224, 71, 0.18)';
                    fCtx.fill();

                    fCtx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    const wingY = Math.sin(frame * 0.5) * 6;
                    fCtx.beginPath();
                    fCtx.ellipse(-2, -8 + wingY, 8, 4, -0.4, 0, Math.PI * 2);
                    fCtx.fill();
                    fCtx.strokeStyle = '#fde047';
                    fCtx.lineWidth = 2.5;
                    fCtx.beginPath();
                    fCtx.arc(-6, 0, 5, 0, Math.PI * 2);
                    fCtx.moveTo(-1, 0);
                    fCtx.lineTo(12, 0);
                    fCtx.lineTo(12, 4);
                    fCtx.stroke();
                    fCtx.restore();

                    // 放寬捕捉判定半徑 (22 -> 32)
                    if (Math.hypot(k.x - playerX, k.y - playerY) < 32) {
                        AudioEngine.playTone(987.77, 'sine', 0.22, 0.15);
                        keys.splice(i, 1);
                        keysCaught++;
                        document.getElementById('l2Keys').textContent = keysCaught;
                        if (keysCaught >= 4) {
                            gameOver = true;
                            completeLevel2();
                            return;
                        }
                        continue;
                    }
                    if (k.x < -30) keys.splice(i, 1);
                }

                requestAnimationFrame(loop);
            }
            loop();
        }

        function completeLevel2() {
            const camp = getCampaign();
            AudioEngine.playSuccess();
            GameState.inventory.push(camp.l2.rewardItem);
            addPoints(50);

            playTransitionScene(
                '第二關通關（+50分）• 禁區陷阱門開啟',
                '躍入深淵：三頭犬與魔鬼網的考驗',
                `你用「${camp.l2.rewardItem}」打開了厚重的橡木大門。門後傳來三頭犬毛毛震耳欲聾的低吼，而陷阱門下方正潛伏著嗜暗的魔鬼網藤蔓！`,
                '🐕',
                prepLevel3A
            );
        }

        /**
         * ==========================================
         * 第三關（上＆下）：各自都有事先說明頁 ＋ 高難度雙重試煉
         * ==========================================
         */
        function prepLevel3A() {
            const camp = getCampaign();
            document.getElementById('hudStageLabel').textContent = '第三關(上)：說明書';
            renderLevelInstructionPage(
                '第三關（上 • 3 / 5）',
                camp.l3.title + ' — 安眠旋律',
                camp.l3.story,
                camp.l3.guideA,
                '🎵 聆聽示範，開始吹奏安眠曲！',
                startLevel3
            );
        }

        function startLevel3() {
            document.getElementById('hudStageLabel').textContent = '第三關(上)：進行中';
            const noteNames = ['🎵 Do', '🎶 Mi', '🎼 Sol', '✨ Si'];
            const targetSeq = Array.from({ length: 6 }, () => Math.floor(Math.random() * 4));
            let userSeq = [];
            let isDemoPlaying = true;

            stage.innerHTML = `
                <div class="animate-scene-enter space-y-4">
                    <div class="border-b border-amber-900/20 pb-2">
                        <h2 class="text-lg sm:text-xl font-black text-amber-950">第三關（上）：三頭犬毛毛的 6 音符記憶考驗</h2>
                        <p class="text-xs text-amber-900/80">仔細記住示範的 <strong>6 個音符</strong>順序，示範結束後憑記憶吹奏！</p>
                    </div>

                    <div class="bg-slate-900 text-amber-200 rounded-xl p-4 text-center space-y-3 border border-amber-500/40 shadow-inner">
                        <div class="text-4xl">🐕‍🦺🐕‍🦺🐕‍🦺</div>
                        <p id="fluteHintText" class="text-xs sm:text-sm text-amber-300 font-bold">
                            🎧 正在示範旋律，請專心記憶……
                        </p>
                        <div class="text-xs text-amber-400">你的吹奏進度：<span id="fluteProgress">等待示範完成</span></div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 pt-1" id="fluteButtons">
                        ${noteNames.map((label, idx) => `
                            <button id="fluteBtn_${idx}" onclick="pressFlute(${idx})" disabled class="magic-btn py-3 px-2 rounded-xl font-bold text-xs sm:text-sm cursor-pointer transition-all">
                                ${label}
                            </button>
                        `).join('')}
                    </div>

                    <div class="text-center">
                        <button id="replayFluteBtn" onclick="playFluteDemo()" disabled class="text-xs underline text-amber-900 hover:text-red-900 cursor-pointer">
                            🔁 重新聆聽一次旋律示範
                        </button>
                    </div>
                </div>
            `;

            window.playFluteDemo = function() {
                isDemoPlaying = true;
                userSeq = [];
                document.querySelectorAll('#fluteButtons button').forEach(b => b.disabled = true);
                document.getElementById('replayFluteBtn').disabled = true;
                document.getElementById('fluteHintText').innerHTML = '🎧 正在示範旋律，請專心記憶……';
                document.getElementById('fluteProgress').textContent = '請看亮起的按鈕順序';

                targetSeq.forEach((noteIdx, step) => {
                    setTimeout(() => {
                        if (!document.getElementById(`fluteBtn_${noteIdx}`)) return;
                        AudioEngine.playFluteNote(noteIdx);
                        const btn = document.getElementById(`fluteBtn_${noteIdx}`);
                        btn.classList.add('ring-4', 'ring-yellow-300', 'scale-105', 'bg-amber-700');
                        setTimeout(() => {
                            if (btn) btn.classList.remove('ring-4', 'ring-yellow-300', 'scale-105', 'bg-amber-700');
                        }, 360);
                    }, step * 580 + 300);
                });

                setTimeout(() => {
                    if (!document.getElementById('fluteButtons')) return;
                    isDemoPlaying = false;
                    document.querySelectorAll('#fluteButtons button').forEach(b => b.disabled = false);
                    document.getElementById('replayFluteBtn').disabled = false;
                    document.getElementById('fluteHintText').innerHTML = '🎶 輪到你了！請憑記憶依序吹奏剛才的 <strong>6 個音符</strong>！';
                    document.getElementById('fluteProgress').textContent = '0 / 6';
                }, targetSeq.length * 580 + 500);
            };

            window.pressFlute = function(idx) {
                if (isDemoPlaying) return;
                AudioEngine.playFluteNote(idx);
                userSeq.push(idx);
                const progEl = document.getElementById('fluteProgress');
                
                const currentStep = userSeq.length - 1;
                if (userSeq[currentStep] !== targetSeq[currentStep]) {
                    AudioEngine.playError();
                    GameState.mistakes++;
                    userSeq = [];
                    progEl.innerHTML = '<span class="text-red-400">音調吹錯了！毛毛怒吼一聲，請從第 1 個音重新吹奏！</span>';
                    return;
                }

                progEl.textContent = `${userSeq.length} / 6（${userSeq.map(i => noteNames[i].split(' ')[1]).join(' → ')}）`;

                if (userSeq.length === targetSeq.length) {
                    AudioEngine.playSuccess();
                    addPoints(25);
                    setTimeout(prepLevel3B, 550);
                }
            };

            playFluteDemo();
        }

        function prepLevel3B() {
            const camp = getCampaign();
            document.getElementById('hudStageLabel').textContent = '第三關(下)：說明書';
            renderLevelInstructionPage(
                '第三關（下 • 3 / 5）',
                camp.l3.title + ' — 太陽火焰魔法陣',
                '三頭犬毛毛沉沉睡去，你順著陷阱門滑落到潮濕冰冷的地下室——四周的魔鬼網藤蔓正瘋狂向你纏繞而來！',
                camp.l3.guideB,
                '🔥 舉起魔杖，開始繪製太陽火焰陣！',
                startLevel3PartB
            );
        }

        function startLevel3PartB() {
            document.getElementById('hudStageLabel').textContent = '第三關(下)：進行中';
            stage.innerHTML = `
                <div class="animate-scene-enter space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-amber-900/20 pb-2">
                        <div>
                            <h2 class="text-lg sm:text-xl font-black text-amber-950">第三關（下）：太陽火焰魔法陣（Lumos Solem）</h2>
                            <p class="text-xs text-amber-900/80">按住滑鼠/手指依序連通 <strong>1 → 2 → 3 → 4 → 5</strong> 符文節點並劃圈充能！</p>
                        </div>
                        <span class="px-2.5 py-1 rounded bg-red-900/20 text-red-900 font-bold text-xs sm:text-sm">
                            藤蔓緊縮：<span id="vineTimer">12.0</span>s
                        </span>
                    </div>

                    <div id="l3bBox" class="game-canvas-box h-64 sm:h-72 relative">
                        <canvas id="spellCanvas" class="w-full h-full block cursor-crosshair"></canvas>
                        <div class="absolute bottom-2 inset-x-0 text-center pointer-events-none text-xs text-amber-300 font-bold">
                            🔥 目前目標符文：<span id="nextRuneLabel" class="text-yellow-300 underline">第 1 符文</span> ｜ 魔法陣充能：<span id="spellCharge">0</span>%
                        </div>
                    </div>
                </div>
            `;

            const sCanvas = document.getElementById('spellCanvas');
            const sCtx = sCanvas.getContext('2d');
            const rect = sCanvas.parentElement.getBoundingClientRect();
            sCanvas.width = rect.width;
            sCanvas.height = rect.height;

            const cx = sCanvas.width / 2;
            const cy = sCanvas.height / 2 - 6;
            const radius = Math.min(sCanvas.width, sCanvas.height) * 0.34;

            // 依四大學院設定不同的五芒星符文起筆與連線順序
            const houseStarConfigs = {
                '葛來分多': [
                    -Math.PI / 2,
                    -Math.PI / 2 + (4 * Math.PI) / 5,
                    -Math.PI / 2 + (8 * Math.PI) / 5,
                    -Math.PI / 2 + (2 * Math.PI) / 5,
                    -Math.PI / 2 + (6 * Math.PI) / 5
                ],
                '雷文克勞': [
                    -Math.PI / 2 + (2 * Math.PI) / 5,
                    -Math.PI / 2 + (8 * Math.PI) / 5,
                    -Math.PI / 2 + (4 * Math.PI) / 5,
                    -Math.PI / 2,
                    -Math.PI / 2 + (6 * Math.PI) / 5
                ],
                '赫夫帕夫': [
                    -Math.PI / 2 + (4 * Math.PI) / 5,
                    -Math.PI / 2,
                    -Math.PI / 2 + (6 * Math.PI) / 5,
                    -Math.PI / 2 + (2 * Math.PI) / 5,
                    -Math.PI / 2 + (8 * Math.PI) / 5
                ],
                '史萊哲林': [
                    -Math.PI / 2 + (6 * Math.PI) / 5,
                    -Math.PI / 2 + (2 * Math.PI) / 5,
                    -Math.PI / 2 + (8 * Math.PI) / 5,
                    -Math.PI / 2 + (4 * Math.PI) / 5,
                    -Math.PI / 2
                ]
            };

            const starOrderAngles = houseStarConfigs[GameState.house] || houseStarConfigs['葛來分多'];

            const nodes = starOrderAngles.map((ang, idx) => ({
                num: idx + 1,
                x: cx + Math.cos(ang) * radius,
                y: cy + Math.sin(ang) * radius,
                activated: false
            }));

            let nextIndex = 0;
            let charge = 0;
            let timeLeft = 12.0;
            let completed = false;
            let failed = false;
            let trail = [];
            let isPointerDown = false;

            const countdown = setInterval(() => {
                if (completed || failed || !document.getElementById('spellCanvas')) {
                    clearInterval(countdown);
                    return;
                }
                timeLeft = Math.max(0, timeLeft - 0.1);
                const tEl = document.getElementById('vineTimer');
                if (tEl) tEl.textContent = timeLeft.toFixed(1);

                if (timeLeft <= 0) {
                    failed = true;
                    clearInterval(countdown);
                    AudioEngine.playError();
                    GameState.mistakes++;
                    document.getElementById('l3bBox').innerHTML = `
                        <div class="w-full h-full flex flex-col items-center justify-center bg-slate-950/95 text-center p-4 space-y-3">
                            <div class="text-red-400 font-black text-lg">🌿 魔鬼網徹底纏住了你們！</div>
                            <p class="text-xs text-amber-200/80">在 12 秒內依序滑過 1→2→3→4→5 符文並充能至 100% 才能釋放太陽火焰咒！</p>
                            <button onclick="startLevel3PartB()" class="magic-btn px-5 py-2 rounded-xl font-bold text-sm cursor-pointer">🔄 重新施展光明咒</button>
                        </div>
                    `;
                }
            }, 100);

            function resetRunes() {
                AudioEngine.playError();
                GameState.mistakes++;
                nodes.forEach(n => n.activated = false);
                nextIndex = 0;
                charge = 0;
                trail = [];
                document.getElementById('nextRuneLabel').textContent = '第 1 符文';
                document.getElementById('spellCharge').textContent = '0';
                sCanvas.parentElement.classList.add('animate-shake');
                setTimeout(() => sCanvas.parentElement?.classList.remove('animate-shake'), 350);
            }

            function handleMove(clientX, clientY) {
                if (completed || failed) return;
                const r = sCanvas.getBoundingClientRect();
                const px = clientX - r.left;
                const py = clientY - r.top;

                trail.push({ x: px, y: py, life: 1.0 });
                if (trail.length > 35) trail.shift();

                nodes.forEach((node, idx) => {
                    const d = Math.hypot(px - node.x, py - node.y);
                    if (d < 24) {
                        if (idx === nextIndex) {
                            node.activated = true;
                            nextIndex++;
                            charge = Math.min(100, nextIndex * 18);
                            AudioEngine.playTone(523 + nextIndex * 90, 'sine', 0.2, 0.14);
                            document.getElementById('spellCharge').textContent = charge;
                            document.getElementById('nextRuneLabel').textContent = nextIndex < 5 ? `第 ${nextIndex + 1} 符文` : '全部連通！持續劃圈充能至 100%！';
                        } else if (idx > nextIndex) {
                            resetRunes();
                        }
                    }
                });

                if (nextIndex === 5) {
                    charge = Math.min(100, charge + 1.4);
                    document.getElementById('spellCharge').textContent = Math.floor(charge);
                    if (charge >= 100) {
                        completed = true;
                        clearInterval(countdown);
                        AudioEngine.playSuccess();
                        addPoints(35);
                        setTimeout(() => {
                            playTransitionScene(
                                '第三關通關（+60分）• 深入地底石室',
                                '智慧與策略的雙重殿堂',
                                '耀眼的太陽火焰將魔鬼網驅散！你穿過石廊，來到了考驗策略、智慧與邏輯推理的第四道防線……',
                                '♟️',
                                prepLevel4
                            );
                        }, 550);
                    }
                }
            }

            sCanvas.addEventListener('mousedown', e => { isPointerDown = true; handleMove(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => isPointerDown = false);
            sCanvas.addEventListener('mousemove', e => { if (isPointerDown) handleMove(e.clientX, e.clientY); });
            sCanvas.addEventListener('touchstart', e => {
                e.preventDefault();
                isPointerDown = true;
                if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });
            sCanvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            function renderSpellLoop() {
                if (completed || failed || !document.getElementById('spellCanvas')) return;
                sCtx.fillStyle = '#070b14';
                sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);

                const shrinkRatio = 1 - (timeLeft / 12.0);
                const vineReach = shrinkRatio * (Math.min(sCanvas.width, sCanvas.height) * 0.45);
                sCtx.strokeStyle = '#14532d';
                sCtx.lineWidth = 12;
                for (let i = 0; i < 12; i++) {
                    const ang = (i / 12) * Math.PI * 2;
                    sCtx.beginPath();
                    sCtx.moveTo(cx + Math.cos(ang) * (radius + 90), cy + Math.sin(ang) * (radius + 90));
                    sCtx.lineTo(cx + Math.cos(ang) * (radius + 75 - vineReach), cy + Math.sin(ang) * (radius + 75 - vineReach));
                    sCtx.stroke();
                }

                sCtx.strokeStyle = nextIndex === 5 ? 'rgba(253, 224, 71, 0.85)' : 'rgba(245, 158, 11, 0.25)';
                sCtx.lineWidth = 2;
                sCtx.beginPath();
                sCtx.arc(cx, cy, radius, 0, Math.PI * 2);
                sCtx.stroke();

                sCtx.beginPath();
                nodes.forEach((n, i) => {
                    if (i === 0) sCtx.moveTo(n.x, n.y);
                    else sCtx.lineTo(n.x, n.y);
                });
                sCtx.closePath();
                sCtx.stroke();

                if (nextIndex > 1) {
                    sCtx.strokeStyle = '#fde047';
                    sCtx.lineWidth = 4;
                    sCtx.beginPath();
                    for (let i = 0; i < nextIndex; i++) {
                        if (i === 0) sCtx.moveTo(nodes[i].x, nodes[i].y);
                        else sCtx.lineTo(nodes[i].x, nodes[i].y);
                    }
                    sCtx.stroke();
                }

                nodes.forEach((n, idx) => {
                    const isTarget = idx === nextIndex;
                    sCtx.beginPath();
                    sCtx.arc(n.x, n.y, isTarget ? 21 : 17, 0, Math.PI * 2);
                    sCtx.fillStyle = n.activated ? '#f59e0b' : (isTarget ? '#7c2d12' : '#1e293b');
                    sCtx.fill();
                    sCtx.lineWidth = isTarget ? 3 : 2;
                    sCtx.strokeStyle = n.activated ? '#fef08a' : (isTarget ? '#fbbf24' : '#64748b');
                    sCtx.stroke();

                    sCtx.fillStyle = '#ffffff';
                    sCtx.font = 'bold 14px Cinzel, serif';
                    sCtx.textAlign = 'center';
                    sCtx.textBaseline = 'middle';
                    sCtx.fillText(n.num, n.x, n.y);
                });

                for (let i = 0; i < trail.length; i++) {
                    const pt = trail[i];
                    pt.life -= 0.04;
                    if (pt.life <= 0) continue;
                    sCtx.beginPath();
                    sCtx.arc(pt.x, pt.y, 8 * pt.life, 0, Math.PI * 2);
                    sCtx.fillStyle = `rgba(254, 240, 138, ${pt.life})`;
                    sCtx.fill();
                }

                requestAnimationFrame(renderSpellLoop);
            }
            renderSpellLoop();
        }

                        THE END OF TERM FEAST • 學年終宴大結算
                    </div>
                    <h2 class="text-2xl sm:text-3xl font-black text-amber-950">${camp.icon} ${GameState.house} 奪得學院盃冠軍！</h2>

                    <!-- 專屬總分區間稱號頒發卡 -->
                    <div class="rounded-2xl bg-gradient-to-r ${rankInfo.rankBadgeColor} p-4 sm:p-5 border-2 shadow-xl space-y-1.5">
                        <div class="text-[11px] uppercase tracking-widest opacity-85 font-bold">鄧不利多校長親自頒發稱號</div>
                        <div class="text-lg sm:text-2xl font-black">${rankInfo.rankTitle}</div>
                        <p class="text-xs sm:text-sm opacity-95 max-w-xl mx-auto leading-relaxed pt-1">${rankInfo.rankDesc}</p>
                    </div>

                    ${renderDialogueBox(
                        'dumbledore',
                        '阿不思·鄧不利多',
                        '霍格華茲校長',
                        `「決定我們成為什麼樣的人，不是我們的能力，而是我們的選擇。<strong>${GameState.playerName}</strong>，你為 <strong>${GameState.house}</strong> 贏得了無上的榮光！」`
                    )}

                    <div class="grid grid-cols-3 gap-2 text-xs bg-amber-950/10 p-3 rounded-xl border border-amber-900/20">
                        <div class="p-2 rounded bg-white/50">
                            <div class="text-amber-900/75 font-semibold">試煉失誤次數</div>
                            <div class="text-lg font-black text-amber-950">${GameState.mistakes} 次</div>
                        </div>
                        <div class="p-2 rounded bg-white/50">
                            <div class="text-amber-900/75 font-semibold">終宴特別追加</div>
                            <div class="text-lg font-black text-emerald-800">+${feastBonus} 分</div>
                        </div>
                        <div class="p-2 rounded bg-white/50">
                            <div class="text-amber-900/75 font-semibold">最終總積分</div>
                            <div class="text-xl font-black text-red-900">${GameState.points} 分</div>
                        </div>
                    </div>

                    <div class="text-[11px] text-amber-900/80 bg-amber-900/10 rounded-lg p-2">
                        📊 稱號分數區間：460+ 傳奇大法師 ｜ 410~459 首席級長 ｜ 360~409 卓越新星 ｜ 359以下 魔法學徒
                    </div>

                    <div class="pt-1 flex flex-wrap justify-center gap-3">
                        <button onclick="resetAndReplay()" class="magic-btn px-6 py-3 rounded-xl font-bold text-sm sm:text-base cursor-pointer">
                            🔄 體驗其他三大學院的專屬路線
                        </button>
                    </div>
                </div>
            `;
            triggerStarBurst();
            setTimeout(triggerStarBurst, 500);
        }

        function resetAndReplay() {
            AudioEngine.playClick();
            GameState.points = 0;
            GameState.mistakes = 0;
            GameState.inventory = ['冬青木魔杖'];
            GameState.house = '未分類';
            document.getElementById('gameHud').classList.add('hidden');
            renderCharacterSelect();
        }

        /**
         * ==========================================
         * 7. 背景魔法星塵畫布動畫 (Canvas)
         * ==========================================
         */
        const bgCanvas = document.getElementById('bgStarCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let bgStars = [];
        let burstSparks = [];

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBg);
        resizeBg();

        for (let i = 0; i < 70; i++) {
            bgStars.push({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                r: Math.random() * 1.8 + 0.5,
                vy: -Math.random() * 0.35 - 0.1,
                alpha: Math.random(),
                dAlpha: Math.random() * 0.02 + 0.005
            });
        }

        function triggerStarBurst() {
            const cx = bgCanvas.width / 2;
            const cy = bgCanvas.height / 2;
            for (let i = 0; i < 32; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = Math.random() * 5 + 1.5;
                burstSparks.push({
                    x: cx,
                    y: cy,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    r: Math.random() * 3 + 1.2,
                    life: 1.0
                });
            }
        }

        function animateBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgStars.forEach(s => {
                s.y += s.vy;
                s.alpha += s.dAlpha;
                if (s.alpha > 1 || s.alpha < 0.2) s.dAlpha = -s.dAlpha;
                if (s.y < 0) s.y = bgCanvas.height;

                bgCtx.beginPath();
                bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(245, 208, 97, ${s.alpha})`;
                bgCtx.fill();
            });

            for (let i = burstSparks.length - 1; i >= 0; i--) {
                const sp = burstSparks[i];
                sp.x += sp.vx;
                sp.y += sp.vy;
                sp.life -= 0.022;
                if (sp.life <= 0) {
                    burstSparks.splice(i, 1);
                    continue;
                }
                bgCtx.beginPath();
                bgCtx.arc(sp.x, sp.y, sp.r, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(254, 240, 138, ${sp.life})`;
                bgCtx.fill();
            }

            requestAnimationFrame(animateBg);
        }

        window.onload = function() {
            animateBg();
            renderCharacterSelect();
        };
    </script>
</body>
</html>
